<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc" font-family="Helvetica, Arial, sans-serif">
  <title id="ttl">Баннер content-strateg</title>
  <desc id="dsc">Конвейер контента: шесть станций — стратегия, ресёрч, производство, fact-check, редактура, дистрибуция — соединены лентой с чекпоинтами; над лентой движется документ.</desc>

  <style>
    .ink{fill:#2a2320}
    .muted{fill:#6b6258}
    .navy{stroke:#1a3a6b}
    .burg{stroke:#7c1f2e}
    .grey{stroke:#4a5568}
    .card{fill:#ffffff}
    .lbl{fill:#4a4039;font-size:13px;font-weight:600;text-anchor:middle}
    .phase{fill:#8a8178;font-size:12px;letter-spacing:2px;text-anchor:middle;text-transform:uppercase}
    .g{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  </style>

  <!-- canvas -->
  <rect x="4" y="4" width="1192" height="392" rx="18" fill="#f7f5f2" stroke="#e6ded6" stroke-width="2"/>

  <!-- ===== left third: title block ===== -->
  <text x="58" y="150" class="ink" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700">content-strateg</text>
  <rect x="60" y="172" width="64" height="4" rx="2" fill="#7c1f2e"/>
  <text x="60" y="208" class="muted" font-size="18">Конвейер контента для Claude&#160;Code</text>
  <text x="60" y="234" class="muted" font-size="18">создание → реализация → продвижение</text>

  <!-- chips -->
  <g font-size="13" font-weight="600">
    <rect x="60" y="262" width="148" height="30" rx="15" fill="#fff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="134" y="282" fill="#1a3a6b" text-anchor="middle">6 субагентов</text>
    <rect x="60" y="300" width="186" height="30" rx="15" fill="#fff" stroke="#7c1f2e" stroke-width="1.5"/>
    <text x="153" y="320" fill="#7c1f2e" text-anchor="middle">/content-pipeline</text>
  </g>

  <!-- divider -->
  <line x1="392" y1="60" x2="392" y2="340" stroke="#e6ded6" stroke-width="2"/>

  <!-- ===== right: conveyor ===== -->
  <!-- phase captions -->
  <text x="532" y="120" class="phase">создание</text>
  <text x="845" y="120" class="phase">реализация</text>
  <text x="1095" y="120" class="phase">продвижение</text>
  <line x1="432" y1="132" x2="632" y2="132" stroke="#c9d2e0" stroke-width="2"/>
  <line x1="682" y1="132" x2="1008" y2="132" stroke="#e3c6cc" stroke-width="2"/>
  <line x1="1058" y1="132" x2="1135" y2="132" stroke="#d4d8dd" stroke-width="2"/>

  <!-- belt connector + arrows + checkpoints -->
  <g stroke="#c9c0b6" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="430" y1="250" x2="1135" y2="250"/>
  </g>
  <g fill="#b3a99e">
    <path d="M553 244 l11 6 -11 6 z"/><path d="M678 244 l11 6 -11 6 z"/>
    <path d="M803 244 l11 6 -11 6 z"/><path d="M928 244 l11 6 -11 6 z"/>
    <path d="M1053 244 l11 6 -11 6 z"/>
  </g>
  <!-- checkpoint stamps (пауза на «да») -->
  <g>
    <g transform="translate(532,250)"><circle r="9" fill="#fff" stroke="#cdbf6e" stroke-width="2"/><path d="M-4 0 l3 3 l5 -6" fill="none" stroke="#b9a93f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(782,250)"><circle r="9" fill="#fff" stroke="#cdbf6e" stroke-width="2"/><path d="M-4 0 l3 3 l5 -6" fill="none" stroke="#b9a93f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(1032,250)"><circle r="9" fill="#fff" stroke="#cdbf6e" stroke-width="2"/><path d="M-4 0 l3 3 l5 -6" fill="none" stroke="#b9a93f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>

  <!-- traveling document with halo -->
  <g transform="translate(720,168) rotate(-6)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#7c1f2e" stroke-width="1.5" opacity="0.25"/>
    <rect x="-17" y="-23" width="34" height="46" rx="4" fill="#fff" stroke="#7c1f2e" stroke-width="2.4"/>
    <line x1="-9" y1="-12" x2="9" y2="-12" stroke="#7c1f2e" stroke-width="2" stroke-linecap="round"/>
    <line x1="-9" y1="-3" x2="9" y2="-3" stroke="#c79aa1" stroke-width="2" stroke-linecap="round"/>
    <line x1="-9" y1="6" x2="3" y2="6" stroke="#c79aa1" stroke-width="2" stroke-linecap="round"/>
  </g>
  <path d="M711 196 q6 14 9 22" fill="none" stroke="#c9c0b6" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- station card template: card + top accent bar + glyph + label -->
  <!-- 1 Стратегия (navy) -->
  <g>
    <rect x="430" y="212" width="84" height="80" rx="12" class="card" stroke="#1a3a6b" stroke-width="2"/>
    <rect x="430" y="212" width="84" height="8" rx="4" fill="#1a3a6b"/>
    <g class="g navy" transform="translate(472,256)">
      <rect x="-15" y="-13" width="13" height="13" rx="2"/><rect x="3" y="-13" width="13" height="13" rx="2"/>
      <rect x="-15" y="3" width="13" height="13" rx="2"/><rect x="3" y="3" width="13" height="13" rx="2"/>
    </g>
    <text x="472" y="312" class="lbl">Стратегия</text>
  </g>

  <!-- 2 Ресёрч (navy) -->
  <g>
    <rect x="555" y="212" width="84" height="80" rx="12" class="card" stroke="#1a3a6b" stroke-width="2"/>
    <rect x="555" y="212" width="84" height="8" rx="4" fill="#1a3a6b"/>
    <g class="g navy" transform="translate(597,256)">
      <path d="M-16 -12 h10 l3 4 h19 v18 a2 2 0 0 1 -2 2 h-28 a2 2 0 0 1 -2 -2 z"/>
      <line x1="-9" y1="2" x2="9" y2="2"/>
    </g>
    <text x="597" y="312" class="lbl">Ресёрч</text>
  </g>

  <!-- 3 Производство (burgundy) -->
  <g>
    <rect x="680" y="212" width="84" height="80" rx="12" class="card" stroke="#7c1f2e" stroke-width="2"/>
    <rect x="680" y="212" width="84" height="8" rx="4" fill="#7c1f2e"/>
    <g class="g burg" transform="translate(722,256)">
      <rect x="-13" y="-16" width="26" height="32" rx="3"/>
      <line x1="-7" y1="-8" x2="7" y2="-8"/><line x1="-7" y1="0" x2="7" y2="0"/><line x1="-7" y1="8" x2="2" y2="8"/>
    </g>
    <text x="722" y="312" class="lbl">Производство</text>
  </g>

  <!-- 4 Fact-check (burgundy) -->
  <g>
    <rect x="805" y="212" width="84" height="80" rx="12" class="card" stroke="#7c1f2e" stroke-width="2"/>
    <rect x="805" y="212" width="84" height="8" rx="4" fill="#7c1f2e"/>
    <g class="g burg" transform="translate(847,254)">
      <circle cx="-3" cy="-3" r="11"/>
      <line x1="5" y1="5" x2="13" y2="13"/>
      <path d="M-8 -3 l3 3 l6 -7" stroke-width="2.2"/>
    </g>
    <text x="847" y="312" class="lbl">Fact-check</text>
  </g>

  <!-- 5 Редактура (burgundy) -->
  <g>
    <rect x="930" y="212" width="84" height="80" rx="12" class="card" stroke="#7c1f2e" stroke-width="2"/>
    <rect x="930" y="212" width="84" height="8" rx="4" fill="#7c1f2e"/>
    <g class="g burg" transform="translate(972,256)">
      <path d="M-14 14 l4 -11 l17 -17 l7 7 l-17 17 z"/>
      <line x1="6" y1="-11" x2="13" y2="-4"/>
      <line x1="-14" y1="14" x2="-10" y2="3"/>
    </g>
    <text x="972" y="312" class="lbl">Редактура</text>
  </g>

  <!-- 6 Дистрибуция (grey hub) -->
  <g>
    <rect x="1055" y="212" width="84" height="80" rx="12" class="card" stroke="#4a5568" stroke-width="2"/>
    <rect x="1055" y="212" width="84" height="8" rx="4" fill="#4a5568"/>
    <g transform="translate(1097,256)">
      <circle cx="0" cy="0" r="6" fill="none" stroke="#4a5568" stroke-width="2.6"/>
      <line x1="0" y1="-6" x2="0" y2="-13" class="g grey"/>
      <line x1="5" y1="3" x2="11" y2="9" class="g grey"/>
      <line x1="-5" y1="3" x2="-11" y2="9" class="g grey"/>
      <!-- chat bubble -->
      <g transform="translate(0,-20)"><rect x="-7" y="-6" width="14" height="10" rx="3" fill="none" stroke="#4a5568" stroke-width="2"/><path d="M-2 4 l0 4 l4 -4" fill="none" stroke="#4a5568" stroke-width="2" stroke-linejoin="round"/></g>
      <!-- play -->
      <g transform="translate(15,13)"><circle r="6.5" fill="none" stroke="#4a5568" stroke-width="2"/><path d="M-2 -3 l5 3 l-5 3 z" fill="#4a5568"/></g>
      <!-- envelope -->
      <g transform="translate(-15,13)"><rect x="-6" y="-4" width="12" height="9" rx="1.5" fill="none" stroke="#4a5568" stroke-width="2"/><path d="M-6 -4 l6 5 l6 -5" fill="none" stroke="#4a5568" stroke-width="1.8"/></g>
    </g>
    <text x="1097" y="312" class="lbl">Дистрибуция</text>
  </g>

</svg>
